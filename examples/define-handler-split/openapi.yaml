openapi: 3.1.0
info:
  title: Define Handler API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /posts:
    get:
      operationId: listPosts
      summary: List posts
      parameters:
        - name: authorId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The posts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Post' }
    post:
      operationId: createPost
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPost' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1 }
      required: [id, name]
    NewUser:
      type: object
      properties:
        name: { type: string, minLength: 1 }
      required: [name]
    Post:
      type: object
      properties:
        id: { type: integer }
        authorId: { type: integer }
        title: { type: string, minLength: 1 }
      required: [id, authorId, title]
    NewPost:
      type: object
      properties:
        authorId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
      required: [authorId, title]
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]
