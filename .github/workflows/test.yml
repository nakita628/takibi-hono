name: Test

# Builds, tests and checks the workspace with the same commands a developer runs locally: the root
# `package.json` scripts are the repository's single definition of "clean", so CI and the working
# copy can never disagree about what it means. `vp run check` is oxfmt, oxlint and the type check,
# then `pnpm lint`: markdownlint, textlint, cspell, secretlint, the TypeSpec release check, and
# actionlint and zizmor over these workflows (downloaded at a pinned, checksummed release).
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run takibi-hono#build

      - run: vp run --filter ./packages/takibi-hono test

      - run: vp run check
