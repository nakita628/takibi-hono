packages:
  - packages/*
  - fixtures/*
  - examples/*
  - test
# TypeSpec ships every @typespec/* package in one release, so each workspace package takes its
# version from this catalog (`"catalog:"`) and Renovate moves them together (see renovate.json).
# Strict mode makes `pnpm add` refuse a version outside the catalog.
catalogMode: strict
catalog:
  '@typespec/compiler': ^1.17.0
  '@typespec/http': ^1.17.0
  '@typespec/openapi': ^1.17.0
  '@typespec/openapi3': ^1.17.0
  '@typespec/rest': ^0.87.0
  '@typespec/versioning': ^0.87.0
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - oas-truth@0.5.1
  - schema-truth@0.7.0
