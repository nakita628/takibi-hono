packages:
  - packages/*
  - fixtures/*
  - test
# TypeSpec ships every @typespec/* package in one release, so each workspace package takes its
# version from this catalog (`"catalog:"`) and Renovate moves them together (see renovate.json).
# Strict mode makes `pnpm add` refuse a version outside the catalog.
catalogMode: strict
catalog:
  '@typespec/compiler': ^1.17.0
  '@typespec/http': ^1.17.0
  '@typespec/openapi': ^1.17.0
  '@typespec/openapi3': ^1.17.0
  '@typespec/rest': ^0.87.0
  '@typespec/versioning': ^0.87.0
allowBuilds:
  esbuild: false
  # Optional native accelerator pulled in through oas-truth -> schema-to-library -> effect ->
  # msgpackr; the JS fallback is enough, so its build script stays off.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@effect/platform-node-shared@4.0.5'
  - '@effect/platform-node@4.0.5'
  - effect@4.0.5
  - hono-takibi@0.24.0
# schema-to-library (through oas-truth) pins @effect/platform-node to a release candidate but
# takes @effect/platform-node-shared with a caret, which would resolve to the 4.0.5 release
# that imports modules the pinned effect does not have. Keep that one tree on its RC; the
# package's own Effect set is the 4.0.5 release hono-takibi uses.
overrides:
  '@effect/platform-node@4.0.0-rc.112>@effect/platform-node-shared': 4.0.0-rc.112
